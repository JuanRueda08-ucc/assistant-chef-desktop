appId: com.chefdigital.app
productName: Chef digital
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/voz/**'
  - '!{plan,.cache-voz}/**'
  - '!**/*.lnk'
asarUnpack:
  - resources/**
  - node_modules/koffi/**
extraResources:
  - from: resources/voz
    to: voz
    filter:
      - vosk-model-small-es-0.42/**
      - LICENCIAS.txt
      - LICENSE-Vosk.txt
win:
  extraResources:
    - from: resources/voz/win32-${arch}
      to: voz/win32-${arch}
  executableName: chef-digital
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  extraResources:
    - from: resources/voz/darwin-${arch}
      to: voz/darwin-${arch}
  entitlementsInherit: build/entitlements.mac.plist
  # Sin certificado de Apple: firma ad hoc para que abra en Macs con chip M (tarea 19, 0028).
  # Al primer arranque macOS avisa; se abre con clic derecho → Abrir (docs/instalar.md).
  identity: '-'
  hardenedRuntime: false
  target:
    - dmg
    - zip
  extendInfo:
    - NSMicrophoneUsageDescription: El chef escucha tus órdenes solo mientras cocinas y activas el micrófono.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  extraResources:
    - from: resources/voz/linux-${arch}
      to: voz/linux-${arch}
  target:
    - AppImage
    - deb
  maintainer: Juan José Rueda
  category: Utility
  artifactName: ${name}-${version}-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Versiones en GitHub Releases (.github/workflows/version.yml): cada etiqueta vX.Y.Z publica
# los instaladores de Windows, macOS y Linux en la versión de esa etiqueta.
publish:
  provider: github
  owner: JuanRueda08-ucc
  repo: assistant-chef-desktop
  releaseType: release
