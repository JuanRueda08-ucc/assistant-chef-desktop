<div
  style="
    margin: 0;
    padding: 40px 16px;
    background: #f3f4ef;
    font-family: Georgia, 'Times New Roman', serif;
    color: #1d1d1b;
  "
>
  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 28px"
  >
    <tr>
      <td style="padding: 36px 40px 0">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td
              style="
                font-family: Arial, Helvetica, sans-serif;
                font-size: 13px;
                font-weight: bold;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: #5f5e5a;
              "
            >
              Chef digital
            </td>
            <td align="right">
              <img
                src="https://raw.githubusercontent.com/JuanRueda08-ucc/assistant-chef-desktop/main/supabase/correos/chef.png"
                width="64"
                height="64"
                alt=""
                style="display: block; border-radius: 50%; background: #ffc83d"
              />
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding: 20px 40px 0">
        <h1 style="margin: 0; font-size: 34px; line-height: 1.15; font-weight: normal">
          Elige una contraseña nueva.
        </h1>
        <p
          style="
            margin: 16px 0 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #5f5e5a;
          "
        >
          Escribe este código en la app y elige tu contraseña nueva.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding: 28px 40px 0">
        <span
          style="
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            font-size: 44px;
            font-weight: bold;
            letter-spacing: 12px;
            line-height: 1;
            padding: 0 4px 6px;
            border-bottom: 10px solid #ffc83d;
          "
          >{{ .Token }}</span
        >
      </td>
    </tr>
    <tr>
      <td style="padding: 28px 40px 36px">
        <p
          style="
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #5f5e5a;
          "
        >
          Caduca en una hora. Si no lo pediste, ignora este correo: tu cuenta sigue segura.
        </p>
        <p style="margin: 24px 0 0; font-size: 17px; font-style: italic">— Tu chef</p>
      </td>
    </tr>
  </table>
</div>
